<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thank you for contacting Yagayya Vig. Your message has been received and I'll get back to you shortly." />
    <title>Thank You | Yagayya Vig</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --accent: #A16207;
        --accent-hover: #854d0e;
        --text: #FAFAF9;
        --text-muted: #a8a29e;
        --bg: #1C1917;
        --card-bg: #292524;
        --border: #44403C;
        --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        --duration: 0.4s;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Montserrat", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }

      h1, h2, h3, h4, .nav-logo {
        font-family: "Cormorant", serif;
      }

      /* Focus States for Accessibility */
      a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      /* Header (Premium Navbar) */
      header {
        position: fixed;
        top: 0;
        width: 100%;
        background: rgba(28, 25, 23, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        z-index: 100;
      }

      .nav-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .nav-logo {
        font-weight: 700;
        font-size: 1.5rem;
        color: var(--text);
        text-decoration: none;
        transition: color var(--duration) ease;
        letter-spacing: 1px;
      }

      .nav-logo span {
        color: var(--accent);
      }

      .nav-links {
        display: flex;
        list-style: none;
        gap: 2rem;
        align-items: center;
      }

      .nav-link {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        transition: color var(--duration) ease;
      }

      .nav-link:hover {
        color: var(--text);
      }
      
      .nav-cta {
        background: var(--accent);
        color: #fff;
        padding: 0.5rem 1.25rem;
        border-radius: 99px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        transition: background var(--duration) ease, transform 0.2s ease;
      }
      
      .nav-cta:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
      }

      /* Mobile Menu Button */
      .mobile-menu-btn {
        display: none;
        background: none;
        border: none;
        color: var(--text);
        font-size: 1.5rem;
        cursor: pointer;
      }

      /* Main content wrapper */
      main {
          padding: 8rem 1.5rem 4rem; /* Top padding to account for fixed header */
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
      }

      .thank-you-card {
          background: var(--card-bg);
          padding: 4rem 3rem;
          border-radius: 16px;
          border: 1px solid var(--border);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
          max-width: 520px;
          width: 100%;
          text-align: center;
      }

      .thank-you-icon {
          font-size: 4rem;
          color: var(--accent);
          margin-bottom: 1.5rem;
      }

      .thank-you-card h1 {
          font-size: 2.5rem;
          color: var(--text);
          margin-bottom: 1rem;
      }

      .thank-you-card p {
          font-size: 1.1rem;
          color: var(--text-muted);
          line-height: 1.6;
          margin-bottom: 2.5rem;
      }

      .btn {
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          padding: 1rem 1.5rem;
          font-size: 1rem;
          font-weight: 600;
          border-radius: 8px;
          text-decoration: none;
          transition: background 0.2s ease, transform 0.2s ease;
          background: var(--text);
          color: var(--bg);
          border: none;
      }

      .btn:hover {
          background: #e7e5e4;
          transform: translateY(-2px);
      }

      /* Mobile Responsive */
      @media (max-width: 768px) {
        .nav-links {
          display: none;
          position: absolute;
          top: 100%;
          left: 0;
          width: 100%;
          background: rgba(28, 25, 23, 0.95);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          flex-direction: column;
          padding: 1rem 0;
          border-bottom: 1px solid var(--border);
          gap: 1.5rem;
        }

        .nav-links.active {
          display: flex;
        }

        .mobile-menu-btn {
          display: block;
        }

        .thank-you-card {
            padding: 2.5rem 1.5rem;
        }

        .thank-you-card h1 {
            font-size: 2rem;
        }
      }
    </style>
</head>
<body>
    <header>
      <nav class="nav-container">
        <a href="index.html" class="nav-logo">YV<span>.</span></a>
        <button class="mobile-menu-btn" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-links">
          <li><a href="index.html#projects" class="nav-link">Work</a></li>
          <li><a href="index.html#tech-stack" class="nav-link">Skills</a></li>
          <li><a href="index.html#about" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-cta">Contact Me</a></li>
        </ul>
      </nav>
    </header>

    <main>
        <div class="thank-you-card">
            <i class="fas fa-check-circle thank-you-icon" aria-hidden="true"></i>
            <h1>Thank You</h1>
            <p>Your message has been received. I'll get back to you as soon as possible.</p>
            <a href="index.html" class="btn">
                <i class="fas fa-arrow-left"></i>
                Back to Home
            </a>
        </div>
    </main>

    <footer style="text-align: center; padding: 3rem 1.5rem; border-top: 1px solid var(--border); margin-top: auto; width: 100%; background: var(--card-bg);">
      <p style="color: var(--text-muted); margin-bottom: 1rem;">&copy; 2025 Yagayya Vig · Delta, BC</p>
      <div style="display: flex; justify-content: center; gap: 1.5rem;">
        <a href="https://github.com/yagayyavig" target="_blank" rel="noopener noreferrer" aria-label="GitHub" style="color: var(--text-muted); font-size: 1.5rem; transition: color 0.2s;">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://linkedin.com/in/yagayya-vig" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" style="color: var(--text-muted); font-size: 1.5rem; transition: color 0.2s;">
          <i class="fab fa-linkedin"></i>
        </a>
      </div>
    </footer>

    <script>
      // Mobile Menu Toggle
      const mobileBtn = document.querySelector('.mobile-menu-btn');
      const navLinks = document.querySelector('.nav-links');
      
      if(mobileBtn && navLinks) {
        mobileBtn.addEventListener('click', () => {
          navLinks.classList.toggle('active');
        });
      }
    </script>
</body>
</html>
